services:
  postgres:
    image: postgres:18.4
    container_name: asm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: asm_db
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asm_user -d asm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0.6
    container_name: asm_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies Alembic migrations, then exits. App services wait for it to succeed.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: asm_migrate
    restart: "no"
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: asm_backend
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - screenshots_data:/app/screenshots
      - ./backend:/app/backend
      - ./scan_output:/app/scan_output
    # Strip any Windows CR before executing, so a CRLF checkout can't break the entrypoint
    command: ["bash", "-c", "tr -d '\\r' < /app/backend/start-dev.sh > /tmp/start-dev.sh && exec bash /tmp/start-dev.sh"]
    extra_hosts:
      - "ms3.local:${LAB_MS3_IP:-192.0.2.1}"
      - "host.docker.internal:host-gateway"     # reach a local Ollama on the host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 40s

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: asm_celery_worker
    restart: unless-stopped
    command: celery -A backend.tasks worker --loglevel=info --concurrency=1
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - screenshots_data:/app/screenshots
      - ./backend:/app/backend
      - ./scan_output:/app/scan_output
    extra_hosts:
      - "ms3.local:${LAB_MS3_IP:-192.0.2.1}"
      - "host.docker.internal:host-gateway"     # reach a local Ollama on the host
    healthcheck:
      # A busy worker (long scan, concurrency=1) can answer slowly, so be patient before flagging it.
      test: ["CMD-SHELL", "celery -A backend.tasks inspect ping -d celery@$$HOSTNAME --timeout 15 >/dev/null 2>&1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: asm_celery_beat
    restart: unless-stopped
    command: celery -A backend.tasks beat --loglevel=info
    env_file:
      - .env.docker
    volumes:
      - ./backend:/app/backend      # same code as the worker, so a `git pull` + restart is enough
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asm_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "pip install --no-cache-dir -r backend/requirements-dev.txt && python -m pytest"
    environment:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/asm_test
      REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: test-only-secret-key-0123456789abcdef0123456789
    volumes:
      - ./backend:/app/backend
      - ./pytest.ini:/app/pytest.ini

volumes:
  postgres_data:
  screenshots_data:
