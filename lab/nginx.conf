# Deliberately misconfigured: serves dotfiles (.git, .env) from the web root, which a hardened server must not.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # nginx hides dotfiles from `location` handling only if told to; serving them is the default and is the point here.
    location / { try_files $uri $uri/ =404; }
}
