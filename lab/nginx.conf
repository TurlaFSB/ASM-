# Deliberately misconfigured: serves dotfiles (.git, .env) from the web root, which a hardened server must not.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    # The two fake leaks. They live under ordinary names in the repository (Git cannot track a folder called .git,
    # and .env is ignored) and are published at the dotfile paths a misconfigured server would expose.
    location = /.git/HEAD { alias /usr/share/nginx/files/git-HEAD; default_type text/plain; }
    location = /.env      { alias /usr/share/nginx/files/env.txt;  default_type text/plain; }
}
