# End-to-end lab. Use together with the base file:
#
#   docker compose -f docker-compose.yml -f lab/docker-compose.lab.yml up -d --build
#   python3 lab/e2e.py
#
# One deliberately misconfigured web server on a fixed address, and the settings that let the platform scan a
# private address. Never run this on a network you do not control: the "vulnerable" host is only a static nginx
# with an exposed .git/HEAD and .env, but the private-target switch is meant for labs only.
services:
  lab:
    image: nginx:1.27.3-alpine
    container_name: asm_lab
    restart: "no"
    volumes:
      - ./lab/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lab/site:/usr/share/nginx/html:ro
    networks:
      default:
        ipv4_address: 172.28.0.80

  backend:
    environment:
      ASM_ALLOW_PRIVATE_TARGETS: "true"

  celery_worker:
    environment:
      ASM_ALLOW_PRIVATE_TARGETS: "true"

  celery_beat:
    environment:
      ASM_ALLOW_PRIVATE_TARGETS: "true"

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
