name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do not include secrets, tokens or details of systems you are not authorized to share.
        For security vulnerabilities, use the private advisory link on the issue chooser instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Add target ...\n2. Run a Standard scan ...\n3. Open ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit (`git log --oneline -1`).
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Docker Compose (development), "Docker Compose + production overlay", "Published images", Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`docker compose logs backend celery_worker --tail 100`. Redact anything sensitive."
      render: text
