name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt
      - name: System libraries (PDF rendering)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info
      - name: Install dependencies
        run: pip install -r requirements.txt -r backend/requirements-dev.txt
      - name: Tests
        run: pytest --cov=backend --cov-report=term --cov-fail-under=84

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: asm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/asm
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Upgrade to head
        run: alembic -c backend/alembic.ini upgrade head
      - name: Downgrade to base (every revision must be reversible)
        run: alembic -c backend/alembic.ini downgrade base
      - name: Upgrade again
        run: alembic -c backend/alembic.ini upgrade head
      - name: Models match the migrations (no missing revision)
        run: alembic -c backend/alembic.ini check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Static analysis (bandit, medium and above)
        run: |
          pip install bandit
          bandit -q -r backend -x backend/tests -ll
      - name: Python dependency audit
        # Accepted risks and reasons are listed in SECURITY.md
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-3552 --ignore-vuln PYSEC-2026-3553 \
            --ignore-vuln PYSEC-2026-3554 --ignore-vuln GHSA-537c-gmf6-5ccf
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
