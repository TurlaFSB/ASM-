name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt
      - name: System libraries (PDF rendering)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info
      - name: Install dependencies
        run: pip install -r requirements.txt -r backend/requirements-dev.txt
      - name: Tests
        run: pytest --cov=backend --cov-report=term --cov-fail-under=78

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Static analysis (bandit, medium and above)
        run: |
          pip install bandit
          bandit -q -r backend -x backend/tests -ll
      - name: Python dependency audit
        # Accepted risks and reasons are listed in SECURITY.md
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-3552 --ignore-vuln PYSEC-2026-3553 \
            --ignore-vuln PYSEC-2026-3554 --ignore-vuln GHSA-537c-gmf6-5ccf
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
