name: Release

# Push a tag like v0.4.0 to publish. The tag must match a "## [0.4.0]" heading in CHANGELOG.md.
# Run it by hand (Actions > Release > Run workflow) for a dry run: it builds and scans both images but publishes nothing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read          # jobs that need more (images, release) ask for it themselves

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: turlafsb

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Work out the version and check the changelog
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
            grep -qE "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
              || { echo "::error::CHANGELOG.md has no dated '## [${version}] - YYYY-MM-DD' section"; exit 1; }
            grep -qx "__version__ = \"${version}\"" backend/version.py \
              || { echo "::error::backend/version.py does not say ${version}; the API would report the wrong version"; exit 1; }
          else
            version="dryrun"
            publish=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.13", cache: pip }
      - run: |
          pip install -r requirements.txt -r backend/requirements-dev.txt
          pip install --no-deps -r requirements-sslyze.txt
          pytest -q -p no:warnings
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run lint && npm test && npm run build

  images:
    needs: [verify, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless signing
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: backend,  context: ".",        file: backend/Dockerfile,  target: prod }
          - { name: frontend, context: frontend,   file: frontend/Dockerfile,  target: "" }
    outputs:
      backend_digest: ${{ steps.out.outputs.backend }}
      frontend_digest: ${{ steps.out.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Image names and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/asm-${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.publish == 'true' }}
          labels: |
            org.opencontainers.image.title=ASM Platform ${{ matrix.name }}
            org.opencontainers.image.licenses=MIT
      - name: Build (local only) for the vulnerability gate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          tags: asm-${{ matrix.name }}:gate
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Gate - no fixable CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --scanners vuln --skip-files usr/local/bin/amass --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress asm-${{ matrix.name }}:gate
      - name: Log in to GHCR
        if: needs.verify.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (with provenance and SBOM)
        id: push
        if: needs.verify.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Sign the image (keyless, bound to this workflow)
        if: needs.verify.outputs.publish == 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign by digest
        if: needs.verify.outputs.publish == 'true'
        run: cosign sign --yes "${REGISTRY}/${OWNER}/asm-${{ matrix.name }}@${{ steps.push.outputs.digest }}"
      - name: Publish digest
        id: out
        if: needs.verify.outputs.publish == 'true'
        run: echo "${{ matrix.name }}=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  release:
    needs: [verify, images]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Release notes from the changelog plus image digests
        run: |
          v="${{ needs.verify.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::empty changelog section for ${v}"; exit 1; }
          {
            echo
            echo "### Images"
            echo
            echo '```text'
            echo "ghcr.io/${OWNER}/asm-backend@${{ needs.images.outputs.backend_digest }}"
            echo "ghcr.io/${OWNER}/asm-frontend@${{ needs.images.outputs.frontend_digest }}"
            echo '```'
            echo
            echo "Verify the signature and pin by digest: see docs/RELEASING.md."
          } >> notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
