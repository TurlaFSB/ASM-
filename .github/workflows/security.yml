name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly, so new advisories surface even without commits

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
            target: prod
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.name }} image
        run: |
          docker build -f ${{ matrix.file }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -t asm-${{ matrix.name }}:scan ${{ matrix.context }}
      # Trivy runs from its official image: no third-party action to pin or to go missing.
      - name: Report fixable HIGH and CRITICAL vulnerabilities (SARIF, shown under Security > Code scanning)
        run: |
          mkdir -p "$HOME/.cache/trivy" trivy-out
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache" \
            -v "$PWD/trivy-out:/out" aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output /out/${{ matrix.name }}.sarif --no-progress asm-${{ matrix.name }}:scan
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache" \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed --no-progress asm-${{ matrix.name }}:scan || true
      - name: List fixable findings as annotations
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache" \
            -v "$PWD/trivy-out:/out" aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output /out/${{ matrix.name }}.json --no-progress asm-${{ matrix.name }}:scan || true
          python3 - <<'PY'
          import json, os
          path = "trivy-out/${{ matrix.name }}.json"
          if os.path.exists(path):
              data = json.load(open(path))
              rows = [(v["Severity"], v["PkgName"], v["InstalledVersion"], v.get("FixedVersion", ""), v["VulnerabilityID"], r.get("Target", ""))
                      for r in data.get("Results", []) for v in r.get("Vulnerabilities", []) or []]
              rows.sort(key=lambda x: (x[0] != "CRITICAL", x[1]))
              for sev, pkg, inst, fix, vid, tgt in rows[:40]:
                  level = "error" if sev == "CRITICAL" else "warning"
                  print(f"::{level} title=Trivy {sev} {vid}::{pkg} {inst} -> {fix} ({tgt})")
              print(f"{len(rows)} fixable HIGH/CRITICAL findings")
          PY
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true   # read-only token on Dependabot PRs
        if: always() && hashFiles(format('trivy-out/{0}.sarif', matrix.name)) != ''
        with:
          sarif_file: trivy-out/${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
      - name: Fail on fixable CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache" \
            aquasec/trivy:latest image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress asm-${{ matrix.name }}:scan
