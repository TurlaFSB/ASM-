version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/frontend"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must always have exactly the same version, so they update in one pull request
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      testing:
        patterns: ["vitest", "jsdom", "@testing-library/*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: "/backend"
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: "/frontend"
    schedule: { interval: monthly }
